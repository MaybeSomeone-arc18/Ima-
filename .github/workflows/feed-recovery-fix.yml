name: Apply tested feed recovery fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/feed-recovery-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ima-dashboard/package-lock.json
      - name: Apply focused recovery patch
        run: |
          printf '%s' '' | base64 --decode > /tmp/feed-recovery.patch
          git apply --check /tmp/feed-recovery.patch
          git apply /tmp/feed-recovery.patch
      - name: Test and build before publishing
        working-directory: ima-dashboard
        run: |
          npm ci
          npm test
          npm run build
      - name: Publish as repository owner and remove one-shot workflow
        run: |
          git config user.name 'Sanskar Kharya'
          git config user.email 'sanskaraman15@gmail.com'
          rm .github/workflows/feed-recovery-fix.yml
          git add ima-dashboard .github/workflows/feed-recovery-fix.yml
          git commit -m 'Fix feed recovery during Render cold starts'
          git push origin HEAD:main
